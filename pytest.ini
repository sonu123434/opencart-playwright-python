[pytest]
pythonpath = .
testpaths = tests
addopts =
	-n 2
	-ra
	--html=artifacts/report.html
	--self-contained-html
	--reruns=1
	--only-rerun=net::ERR_|ECONNRESET|NS_ERROR_NET_
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
markers =
	smoke: critical, fast user journeys
	sanity: basic post-deployment checks
	regression: broader behavior verification
	login: authentication scenarios
	shopping: product and cart scenarios
	checkout: checkout entry or validation scenarios